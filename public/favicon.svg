<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080808;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bgGradient)"/>

  <!-- T Logo -->
  <g transform="translate(32, 32)">
    <!-- Horizontal bar of T -->
    <rect x="-18" y="-16" width="36" height="6" fill="#F5F5F5" rx="2"/>
    <!-- Vertical bar of T -->
    <rect x="-4" y="-10" width="8" height="24" fill="#F5F5F5" rx="2"/>
    <!-- Accent dot -->
    <circle cx="0" cy="18" r="2.5" fill="#F5F5F5"/>
  </g>
</svg>
